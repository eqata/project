<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вариант 7 — Список</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            padding: 40px;
        }
        .container {
            background: #fff;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 20px;
            margin-bottom: 15px;
            text-align: center;
        }
        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }
        input {
            flex: 1;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
        }
        button {
            padding: 8px 15px;
            background: #3498db;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover {
            background: #2980b9;
        }
        ul {
            padding-left: 20px;
            margin: 0;
        }
        li {
            padding: 5px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Мой список</h1>

        <div class="input-group">
            <input type="text" id="itemInput" placeholder="Введите текст...">
            <button id="addBtn">Добавить</button>
        </div>

        <ul id="myList"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
